plugins {
    alias(libs.plugins.shadow)
}

base {
    archivesName.set("NamedEntityDeathMessages-common")
}

dependencies {
    // Logging
    compileOnly('org.slf4j:slf4j-api:2.0.5')
}

shadowJar {
    dependencies {}

    archiveClassifier.set("")
}
shadowJar.doLast {
    task ->
        ant.checksum(file: task.archivePath) {
            hashAlgorithm = 'md5'
            property = 'md5sum'
        }
}

artifacts {
    archives(shadowJar)
}
